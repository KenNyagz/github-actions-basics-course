name: Secret Example

on:
  workflow_dispatch:

permissions: {}

jobs:
  test-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Check that TEST_SECRET is configured
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -z "$TEST_SECRET" ]; then
            echo "::error::TEST_SECRET is not configured."
            exit 1
          fi
          echo "TEST_SECRET is configured."
