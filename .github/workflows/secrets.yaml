name: test secrets

on:
  workflow_dispatch:

jobs:
  test-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Test secrets
        run: |
          echo "Testing secrets..."
          echo "MY_SECRET: ${{ secrets.MY_SECRET }}"
          echo "secret:"
          echo ${{ secrets.MY_SECRET }} | sed ' s/./&  /g' #mod the secret to undo auto redaction by github actions; for learning only