name: Publish NPM package
###
on:
  push:
    branches:
      - main
      - practice
    paths:
      - typescript-project/**
  workflow_dispatch:

jobs:
  pull_request:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: typescript-project

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Setup Nodejs
        uses: actions/setup-node@v2
        with:
          node-version: "16.x"
          #cache: 'npm'
          #cache-dependency-path: typescript-project/yarn.lock

      - run: git config user.email "kennyagz681@gmail.com"
      - run: git config user.name "@github-ci"
      - run: yarn version --patch --message "Bump version to %s"

      - run: git push
      - run: git push --follow-tags

      - name: publish to github
        run: |
          npm config set registry https://npm.pkg.github.com
          npm set //npm.pkg.github.com/:_authToken ${{ env.NODE_AUTH_TOKEN }}
          npm run publish:github

        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}