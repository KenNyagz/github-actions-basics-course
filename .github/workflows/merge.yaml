name: Merge Example

on:
  workflow_dispatch:
    inputs:
      confirm_version_commit:
        description: Confirm creating and pushing a version commit and tag
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  merge:
    if: inputs.confirm_version_commit
    runs-on: ubuntu-latest
    environment: versioning

    defaults:
      run:
        working-directory: typescript-project

    steps:
      - uses: actions/checkout@v4

      # Setup Nodejs
      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: "16.x"
          cache: 'npm'
          cache-dependency-path: typescript-project/yarn.lock

      # Install Yarn
      - name: Install Yarn
        run: npm install --global yarn

      # Install libraries
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Run linting
      - name: Run linting
        run: yarn lint

      # Compile the code
      - name: Build project
        run: yarn build

      # Run tests
      - name: Run tests
        run: yarn test

      - run: git config user.email "scottwestover2006@gmail.com"
      - run: git config user.name "@github-ci"
      - run: yarn version --patch --message "Bump version to %s"

      - run: git push
      - run: git push --follow-tags
